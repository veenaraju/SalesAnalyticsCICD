name: Sales Analytics CI/CD

on:
  push:
    branches: [main, "feature/**", "bugfix/**"]
  pull_request:
    branches: [main]

jobs:
  # 1. CI: Lint, Test, and Build Deployable Wheel (.whl)
  build-and-test:
    runs-on: [self-hosted, Windows, X64, sales-local]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup CI virtual environment & dependencies
        shell: powershell
        run: |
          $Venv = "C:\Users\veens\Python_Projects\action-runner\_venvs\SalesAnalyticsCI"
          if (-not (Test-Path "$Venv\Scripts\python.exe")) {
            py -3.11 -m venv $Venv
          }
          & "$Venv\Scripts\python.exe" -m pip install -r requirements-dev.txt -e .

      - name: Run Ruff & Pytest
        shell: powershell
        run: |
          $Python = "C:\Users\veens\Python_Projects\action-runner\_venvs\SalesAnalyticsCI\Scripts\python.exe"
          & $Python -m ruff check .
          & $Python -m pytest tests/ -v

      - name: Build deployable Wheel (.whl)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: powershell
        run: |
          $Python = "C:\Users\veens\Python_Projects\action-runner\_venvs\SalesAnalyticsCI\Scripts\python.exe"
          $ArtifactDir = "C:\Users\veens\Deployment\SalesAnalyticsCICD\artifacts"
          New-Item -ItemType Directory -Force -Path $ArtifactDir | Out-Null
          Remove-Item "dist\*", "$ArtifactDir\*.whl" -Force -ErrorAction SilentlyContinue
          & $Python -m build --wheel --no-isolation
          Copy-Item "dist\*.whl" $ArtifactDir -Force

  # 2. CD: Auto-deploy to DEV
  deploy-dev:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64, sales-local]
    environment: dev
    steps:
      - name: Checkout deployment script
        uses: actions/checkout@v4

      - name: Deploy to DEV
        shell: powershell
        run: .\scripts\deploy.ps1 -EnvironmentName DEV -Port 8501

  # 3. CD: Deploy to QA (requires approval in GitHub 'qa' environment)
  deploy-qa:
    needs: deploy-dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64, sales-local]
    environment: qa
    steps:
      - name: Checkout deployment script
        uses: actions/checkout@v4

      - name: Deploy to QA
        shell: powershell
        run: .\scripts\deploy.ps1 -EnvironmentName QA -Port 8502
